<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{SITE_NAME}} - 博客文章">
  <title>文章 - {{SITE_NAME}}</title>
  <script src="https://cdn.staticfile.org/marked/12.0.0/marked.min.js"></script>
  <link rel="preconnect" href="https://cdn.staticfile.org" crossorigin>
  <style>
    *, ::before, ::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    a { color: inherit; text-decoration: none; cursor: url('../mouse/02.cur'), pointer; }
    h1, h2, h3, h4, p, ol, ul { margin: 0; padding: 0; }
    ol, ul { list-style: none; }
    img { display: block; max-width: 100%; }

    body {
      background: #f7f4ee;
      color: #1e1c19;
      font-family: "OPPO Serif SC", "Source Han Serif SC", "Songti SC", "STSong", Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.9;
      cursor: url('../mouse/01.cur'), auto;
    }
    .site-header {
      max-width: 776px;
      margin: 0 auto;
      padding: 44px 28px 0;
    }
    .brand {
      font-family: Georgia, "Times New Roman", "Songti SC", serif;
      font-style: italic;
      font-size: 28px;
      font-weight: 600;
    }
    main {
      max-width: 776px;
      margin: 0 auto;
      padding: 40px 28px 28px;
    }
    .back {
      display: inline-block;
      margin-bottom: 32px;
      color: #6b655b;
      font-size: 14px;
    }
    .back:hover { color: #a8412c; }
    .post-meta {
      margin-bottom: 10px;
      color: #8a8377;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 12px;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.4;
    }
    .post-date {
      display: block;
      margin-bottom: 32px;
      color: #6b655b;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 14px;
    }
    article { overflow-wrap: break-word; }
    article p { margin-bottom: 20px; }
    article h2 {
      margin: 40px 0 16px;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.5;
    }
    article h3 {
      margin: 32px 0 12px;
      font-size: 21px;
      font-weight: 600;
    }
    article ul,
    article ol {
      margin: 0 0 20px 1.4em;
    }
    article ul { list-style: disc; }
    article ol { list-style: decimal; }
    article li { margin-bottom: 6px; }
    article a {
      color: #a8412c;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    article blockquote {
      margin: 0 0 20px;
      padding: 4px 0 4px 18px;
      border-left: 2px solid #a8412c;
      color: #6b655b;
    }
    article blockquote p { margin-bottom: 0; }
    article img {
      margin: 24px auto;
      height: auto;
    }
    article code {
      padding: 2px 5px;
      background: rgba(30, 28, 25, 0.06);
      border-radius: 2px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.86em;
    }
    article pre {
      margin: 0 0 24px;
      padding: 16px 18px;
      background: #efe9de;
      border: 1px solid rgba(30, 28, 25, 0.08);
      overflow-x: auto;
    }
    article pre code {
      padding: 0;
      background: none;
      font-size: 14px;
      line-height: 1.7;
    }
    article table {
      width: 100%;
      margin: 0 0 24px;
      border-collapse: collapse;
      font-size: 16px;
    }
    article th,
    article td {
      padding: 8px 10px;
      border-bottom: 1px solid rgba(30, 28, 25, 0.12);
      text-align: left;
    }
    article th {
      font-weight: 600;
      border-bottom-width: 2px;
    }
    article hr {
      margin: 32px 0;
      border: 0;
      border-top: 1px solid rgba(30, 28, 25, 0.12);
    }
    .mermaid {
      margin: 24px 0;
      text-align: center;
      overflow-x: auto;
    }
    .post-actions {
      margin-top: 44px;
      padding-top: 24px;
      border-top: 1px solid rgba(30, 28, 25, 0.1);
    }
    .like-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border: 1px solid rgba(30, 28, 25, 0.18);
      border-radius: 999px;
      background: transparent;
      color: #6b655b;
      font-family: inherit;
      font-size: 14px;
      cursor: url('../mouse/02.cur'), pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .like-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
    }
    .like-btn:hover:not(:disabled) { color: #a8412c; border-color: #a8412c; }
    .like-btn:disabled { cursor: default; }
    .like-btn.liked { color: #a8412c; border-color: #a8412c; }
    .like-btn.liked svg { fill: currentColor; }
    .like-btn b {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .load-tip {
      color: #6b655b;
      font-size: 16px;
    }
    .site-footer {
      max-width: 776px;
      margin: 0 auto;
      padding: 24px 28px 44px;
      border-top: 1px solid rgba(30, 28, 25, 0.1);
      color: #6b655b;
      font-size: 13px;
    }
    @media (max-width: 820px) {
      .site-header { padding: 28px 20px 0; }
      .brand { font-size: 24px; }
      main { padding: 32px 20px 24px; }
      h1 { font-size: 30px; }
      article h2 { font-size: 23px; }
      article table { font-size: 14px; }
      article th, article td { padding: 6px 8px; }
      .site-footer { padding: 20px 20px 36px; }
    }
    @media (max-width: 480px) {
      .site-header { padding: 22px 18px 0; }
      main { padding: 26px 18px 20px; }
      h1 { font-size: 26px; }
      .post-date { margin-bottom: 24px; }
      article { font-size: 17px; line-height: 1.85; }
      article pre { padding: 12px 14px; }
      article pre code { font-size: 13px; }
      .post-actions { margin-top: 34px; }
      .site-footer { padding: 18px 18px 32px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../index.html">{{SITE_NAME}}</a>
  </header>

  <main>
    <a class="back" href="../index.html">← 返回文章归档</a>
    <p class="post-meta" id="postCategory">&nbsp;</p>
    <h1 id="postTitle">加载中…</h1>
    <time class="post-date" id="postDate"></time>

    <article id="postBody">
      <p class="load-tip">正在读取文章…</p>
    </article>

    <div class="post-actions">
      <button class="like-btn" id="likeBtn" type="button" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.3l-1.3-1.2C6.1 14.9 3 12.1 3 8.7 3 6 5.1 3.9 7.8 3.9c1.5 0 3 .7 4.2 2 1.2-1.3 2.7-2 4.2-2C19 3.9 21 6 21 8.7c0 3.4-3.1 6.2-7.7 10.4L12 20.3z"/></svg>
        <span>点赞</span>
        <b id="likeCount">—</b>
      </button>
    </div>
  </main>

  <footer class="site-footer">
    © {{YEAR}} {{SITE_NAME}}
  </footer>

  <script src="posts-data.js"></script>
  <script>
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    async function renderPost() {
      const slug = new URLSearchParams(location.search).get('post') || '';
      const body = document.getElementById('postBody');
      const category = document.getElementById('postCategory');

      if (!/^[\w.-]+$/.test(slug)) {
        document.getElementById('postTitle').textContent = '文章不存在';
        body.innerHTML = '<p class="load-tip">请从文章归档进入。</p>';
        return;
      }

      const posts = Array.isArray(window.BLOG_POSTS) ? window.BLOG_POSTS : [];
      const post = posts.find(item => item.slug === slug || item.file === slug);

      if (!post) {
        document.getElementById('postTitle').textContent = '文章不存在';
        body.innerHTML = '<p class="load-tip">没有找到这篇文章，可能已被移除。请返回归档查看现有文章。</p>';
        return;
      }

      const title = post.title || slug;
      document.title = title + ' - {{SITE_NAME}}';
      document.getElementById('postTitle').textContent = title;
      category.textContent = post.category || '';
      document.getElementById('postDate').textContent = post.date || '';
      document.getElementById('postDate').setAttribute('datetime', post.date || '');

      body.innerHTML = marked.parse(post.content || '');

      const base = post.base || 'posts/';
      body.querySelectorAll('img').forEach(img => {
        const src = img.getAttribute('src') || '';
        if (!src || /^(https?:)?\/\//.test(src) || src.startsWith('/') || src.startsWith('data:')) return;
        img.setAttribute('src', base + src.replace(/^\.\//, ''));
      });

      body.querySelectorAll('pre code.language-mermaid').forEach(code => {
        const box = document.createElement('div');
        box.className = 'mermaid';
        box.textContent = code.textContent;
        code.parentElement.replaceWith(box);
      });

      if (body.querySelector('.mermaid')) {
        try {
          await loadScript('https://cdn.staticfile.org/mermaid/10.6.1/mermaid.min.js');
          if (window.mermaid) {
            mermaid.initialize({
              startOnLoad: false,
              theme: 'neutral',
              securityLevel: 'loose',
              fontFamily: 'inherit'
            });
            await mermaid.run({ nodes: body.querySelectorAll('.mermaid') });
          }
        } catch (err) {
          // 图表库加载失败时保留原始代码块
        }
      }

      initLikes(slug);
    }

    function initLikes(slug) {
      const btn = document.getElementById('likeBtn');
      const countEl = document.getElementById('likeCount');
      if (!btn || !countEl) return;

      const api = '/api/counter?key=';
      const key = 'like-' + slug;
      const likedKey = 'voted:' + slug;
      let liked = false;
      try { liked = localStorage.getItem(likedKey) === '1'; } catch (e) {}

      function applyLiked() {
        btn.classList.toggle('liked', liked);
        btn.setAttribute('aria-pressed', String(liked));
        btn.querySelector('span').textContent = liked ? '已赞' : '点赞';
        btn.disabled = liked;
      }

      fetch(api + key, { cache: 'no-store' })
        .then(res => res.ok ? res.json() : Promise.reject())
        .then(data => {
          const value = Number(data && data.count);
          if (!Number.isFinite(value)) return;
          countEl.textContent = value.toLocaleString('zh-CN');
          btn.hidden = false;
          applyLiked();
        })
        .catch(() => {});

      btn.addEventListener('click', () => {
        if (liked) return;
        btn.disabled = true;
        fetch(api + key, { method: 'POST', cache: 'no-store' })
          .then(res => res.ok ? res.json() : Promise.reject())
          .then(data => {
            const value = Number(data && data.count);
            if (Number.isFinite(value)) countEl.textContent = value.toLocaleString('zh-CN');
            liked = true;
            try { localStorage.setItem(likedKey, '1'); } catch (e) {}
            applyLiked();
          })
          .catch(() => { btn.disabled = false; });
      });
    }

    renderPost();
  </script>
</body>
</html>
