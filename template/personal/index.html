<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于 - {{SITE_NAME}}</title>
  <meta name="description" content="{{SITE_NAME}} - 关于">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background: #f7f4ee;
      color: #2b2b2b;
      cursor: url('../mouse/01.cur'), auto;
      line-height: 1.8;
    }
    a, button { cursor: url('../mouse/02.cur'), pointer; }
    .card {
      width: min(720px, 100%);
      background: #fff;
      border: 1px solid #e6e0d4;
      border-radius: 18px;
      padding: clamp(28px, 6vw, 56px);
      box-shadow: 0 18px 40px rgba(60, 50, 35, .08);
    }
    .back {
      display: inline-block;
      margin-bottom: 28px;
      font-size: .85rem;
      color: #7a8f7d;
      text-decoration: none;
      letter-spacing: .04em;
    }
    .back:hover { color: #4a6b57; }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: .02em;
      color: #33513f;
      margin-bottom: 6px;
      word-break: break-word;
    }
    .author {
      color: #8a9a8c;
      font-size: .9rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .intro {
      color: #4c4c4c;
      margin-bottom: 36px;
      white-space: pre-line;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding-top: 24px;
      border-top: 1px solid #eee7da;
    }
    nav a {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid #d8e4da;
      border-radius: 999px;
      color: #47654f;
      text-decoration: none;
      font-size: .9rem;
      transition: background .2s ease, color .2s ease;
    }
    nav a:hover { background: #47654f; color: #fff; }
    footer {
      margin-top: 32px;
      font-size: .78rem;
      color: #a8a294;
      letter-spacing: .06em;
    }
  </style>
</head>
<body>
  <main class="card">
    <a class="back" href="../index.html">← 返回首页</a>
    <h1>{{SITE_NAME}}</h1>
    <p class="author">{{AUTHOR}}</p>
    <p class="intro">{{SITE_INTRO}}</p>
    <nav>
      <a href="../index.html">博客</a>
      <a href="../music.html">音乐</a>
      <a href="{{GITHUB_URL}}" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="{{CONTACT_URL}}">联系</a>
    </nav>
    <footer>© {{YEAR}} {{SITE_NAME}}</footer>
  </main>
</body>
</html>
